# Local development broker. Mirrors the VPS broker's rules (no anonymous access,
# password file + ACL) but without TLS: the server uses plain TCP (like
# mosquitto:1883 on the VPS) and the browser uses WebSockets (Caddy adds TLS there).
per_listener_settings false
allow_anonymous false
# Written at container start from the passwords in .env (see compose.dev.yaml).
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning

# Plain MQTT for probe-server.
listener 1883
protocol mqtt

# MQTT over WebSockets for the browser (mqtt.js), path-agnostic.
listener 9001
protocol websockets
