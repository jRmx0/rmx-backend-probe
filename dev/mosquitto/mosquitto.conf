# Local development broker. Mirrors the VPS broker's rules (no anonymous access,
# password file + ACL) but without TLS: the server and the test "device" use
# plain TCP (on the VPS: the server on mosquitto:1883, devices on 8883 with TLS).
# No WebSockets: browsers don't use MQTT; only devices and the server do.
per_listener_settings false
allow_anonymous false
# Written at container start from the passwords in .env (see compose.dev.yaml).
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning

# Plain MQTT for probe-server and the tests.
listener 1883
protocol mqtt
