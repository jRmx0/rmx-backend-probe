[package]
name = "probe-server"
description = "Blade of Grass backend probe: CRUD over HTTPS, WSS and MQTT on TimescaleDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Turns on the integration tests in tests/, which need the dev compose stack
# (or CI's) running: `cargo test --features integration-tests`.
integration-tests = []

[[test]]
name = "integration"
required-features = ["integration-tests"]

[dependencies]
probe-protocol = { workspace = true, features = ["sqlx"] }

anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
rumqttc.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rand.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
