version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  # Bun has its own ecosystem: "npm" (npm_and_yarn) refuses to touch bun.lock
  # and fails with "Bun is misconfigured in this repository".
  - package-ecosystem: bun
    directory: /client
    schedule:
      interval: weekly
    groups:
      client:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Bun is pinned in three places (this Dockerfile, bun-version in ci.yml,
      # and the developer's PC), so it is bumped by hand, all at once.
      - dependency-name: oven/bun
