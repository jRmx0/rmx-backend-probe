version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  # Bun projects use the npm ecosystem; Dependabot reads package.json + bun.lock.
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Bun is pinned in three places (this Dockerfile, bun-version in ci.yml,
      # and the developer's PC), so it is bumped by hand, all at once.
      - dependency-name: oven/bun
