version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  # Bun has its own ecosystem: "npm" (npm_and_yarn) refuses to touch bun.lock
  # and fails with "Bun is misconfigured in this repository".
  - package-ecosystem: bun
    directory: /client
    schedule:
      interval: weekly
    groups:
      client:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (typescript-go) breaks `bun run lint`: typescript-eslint
      # supports only TS < 6.1 (checked 2026-10-18, v8.71.2). Remove this rule
      # once https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # is resolved and a release supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Bun is pinned in three places (this Dockerfile, bun-version in ci.yml,
      # and the developer's PC), so it is bumped by hand, all at once.
      - dependency-name: oven/bun
